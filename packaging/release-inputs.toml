format-version = 1

# Release artifacts stay missing until a real candidate run creates them.
[[artifact]]
name = "dependency-notices"
status = "missing"
missing-reason = "A release dependency-license inventory has not been generated and reviewed."

[[artifact]]
name = "release-sbom"
status = "missing"
missing-reason = "No release candidate exists from which to seal the reviewed SBOM."

[[artifact]]
name = "provenance"
status = "missing"
missing-reason = "No native packaging run has produced release provenance."

[[artifact]]
name = "release-gate-evidence"
status = "missing"
missing-reason = "The v1 release gates have not been completed on the supported platform matrix."

[[platform]]
name = "windows"
architecture = "x86_64"
package-format = "msix"
package-definition = "packaging/windows/AppxManifest.xml.in"
package-assets-status = "missing"
package-assets-missing-reason = "Required Windows package logos and application icon have not been approved or exported."
minimum-version-status = "missing"
minimum-version-missing-reason = "Existing Windows CI compiles and tests on a moving latest image; it does not prove a minimum Windows version by native runtime validation."
signing-status = "missing"
signing-missing-reason = "The Windows signing identity, timestamp policy, and secret references have not been approved."
notarization-status = "not-applicable"

[[platform]]
name = "macos"
architecture = "unfrozen"
package-format = "dmg"
package-definition = "packaging/macos/Info.plist.in"
package-assets-status = "missing"
package-assets-missing-reason = "The macOS application icon has not been approved or exported."
minimum-version-status = "missing"
minimum-version-missing-reason = "Existing macOS CI compiles and tests on a moving latest image; it does not prove a minimum macOS version by native runtime validation."
signing-status = "missing"
signing-missing-reason = "The Developer ID identity and keychain secret references have not been approved."
notarization-status = "missing"
notarization-missing-reason = "The Apple notary profile, credential references, and stapling workflow have not been approved."

[[platform]]
name = "linux"
architecture = "x86_64"
package-format = "deb"
package-definition = "packaging/linux/debian/control.in"
package-assets-status = "missing"
package-assets-missing-reason = "The Linux application icon has not been approved or exported."
minimum-version-status = "missing"
minimum-version-missing-reason = "Existing Linux CI compiles and tests on a moving latest image; it does not prove a minimum distribution version by native runtime validation."
signing-status = "missing"
signing-missing-reason = "The Linux package-signing and distribution-channel policy has not been approved."
notarization-status = "not-applicable"
