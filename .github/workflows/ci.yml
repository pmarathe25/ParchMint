name: CI

on:
  pull_request:
    paths:
      - ".agents/skills/**"
      - ".github/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "packaging/**"
      - "crates/**"
      - "rust-toolchain.toml"
      - "tests/**"
      - "third_party/**"
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".agents/skills/**"
      - ".github/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "packaging/**"
      - "crates/**"
      - "rust-toolchain.toml"
      - "tests/**"
      - "third_party/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.97.1"
  CARGO_BUILD_JOBS: "1"

jobs:
  workspace:
    name: ${{ matrix.os }} / workspace
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Test UI review helpers
        run: python -m unittest discover -s .agents/skills/parchmint-ui-review/scripts -p 'test_*.py'

      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install "$RUST_TOOLCHAIN"
          --profile minimal
          --component clippy
          --component rustfmt

      - name: Fetch locked dependencies
        run: cargo +$RUST_TOOLCHAIN fetch --locked

      - name: Verify workspace metadata
        run: cargo +$RUST_TOOLCHAIN metadata --locked --offline --no-deps --format-version 1

      - name: Verify formatting
        run: cargo +$RUST_TOOLCHAIN fmt --all --check

      - name: Check locked workspace
        run: cargo +$RUST_TOOLCHAIN check --workspace --all-targets --locked --offline

      - name: Lint locked workspace
        run: >-
          cargo +$RUST_TOOLCHAIN clippy
          --workspace
          --all-targets
          --locked
          --offline
          --
          -D warnings

      - name: Test locked workspace
        run: cargo +$RUST_TOOLCHAIN test --workspace --locked --offline

      - name: Test patched renderer
        run: cargo +$RUST_TOOLCHAIN test -p iced_tiny_skia --lib --locked --offline

  release:
    name: ${{ matrix.platform }} / native package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            target: x86_64-unknown-linux-gnu
            suffix: ""
          - os: macos-latest
            platform: macos
            target: aarch64-apple-darwin
            suffix: ""
          - os: windows-latest
            platform: windows
            target: x86_64-pc-windows-msvc
            suffix: ".exe"
    env:
      RUSTFLAGS: ${{ matrix.platform == 'windows' && '-C target-feature=+crt-static' || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v6
        if: matrix.platform == 'windows'
        with:
          dotnet-version: '8.0.x'
      - name: Install Windows packaging tools
        if: matrix.platform == 'windows'
        run: dotnet tool install --global wix --version 5.0.2
      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - name: Build the desktop with release features only
        run: cargo +$RUST_TOOLCHAIN build --release --locked -j 1 --target "${{ matrix.target }}" -p parchmint-desktop --bin parchmint
      - name: Verify release diagnostics filtering
        run: cargo +$RUST_TOOLCHAIN test --release --locked -j 1 --target "${{ matrix.target }}" -p parchmint-diagnostics --test release_logging
      - name: Verify packaging
        run: python -m unittest discover -s packaging -p 'test_*.py'
      - name: Fetch locked sources for dependency notices
        run: cargo +$RUST_TOOLCHAIN fetch --locked
      - name: Configure macOS distribution signing
        if: matrix.platform == 'macos' && startsWith(github.ref, 'refs/tags/v')
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.MACOS_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.MACOS_APP_PASSWORD }}
          TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: python packaging/macos_signing.py
      - name: Create native package
        run: python packaging/package.py --binary "target/${{ matrix.target }}/release/parchmint${{ matrix.suffix }}" --platform "${{ matrix.platform }}" --output release
      - name: Verify Linux installation
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get install -y ./release/*.deb
          parchmint --version
          sudo apt-get remove -y parchmint
      - name: Verify installed macOS application and native UI
        if: matrix.platform == 'macos'
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          python packaging/verify_macos.py --image release/*.dmg --version "$version" \
            --architecture "$(uname -m)" --output "$RUNNER_TEMP/macos-verification"
      - name: Retain macOS verification captures
        if: always() && matrix.platform == 'macos'
        uses: actions/upload-artifact@v7
        with:
          name: macOS-verification-${{ matrix.target }}
          path: ${{ runner.temp }}/macos-verification
          if-no-files-found: warn
      - name: Verify Windows installation
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $package = (Get-Item release/*.msi).FullName
          $install = Start-Process msiexec.exe -ArgumentList "/i `"$package`" /qn /norestart" -Wait -PassThru
          if ($install.ExitCode -notin @(0, 3010)) { throw "MSI installation failed: $($install.ExitCode)" }
          try {
            # GUI executables return control before PowerShell updates LASTEXITCODE.
            $application = Start-Process -FilePath "$env:ProgramFiles/ParchMint/parchmint.exe" -ArgumentList "--version" -NoNewWindow -Wait -PassThru
            if ($application.ExitCode -ne 0) { throw "Installed executable failed: $($application.ExitCode)" }
            if (!(Test-Path "$env:ProgramData/Microsoft/Windows/Start Menu/Programs/ParchMint.lnk")) {
              throw "Start menu shortcut missing"
            }
          } finally {
            $uninstall = Start-Process msiexec.exe -ArgumentList "/x `"$package`" /qn /norestart" -Wait -PassThru
            if ($uninstall.ExitCode -notin @(0, 3010)) { throw "MSI removal failed: $($uninstall.ExitCode)" }
          }
      - name: Remove temporary macOS signing keychain
        if: always() && matrix.platform == 'macos' && startsWith(github.ref, 'refs/tags/v')
        run: security delete-keychain "$RUNNER_TEMP/parchmint-signing.keychain-db" || true
      - uses: actions/upload-artifact@v7
        with:
          name: ParchMint-${{ matrix.target }}
          path: |
            release/*.deb
            release/*.dmg
            release/*.msi
            release/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [workspace, release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check release tag matches the package version
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("Cargo.toml").read_text(encoding="utf-8"))["workspace"]["package"]["version"]
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit(f"Release tag must be v{version} to match Cargo.toml")
          PY
      - uses: actions/download-artifact@v8
        with:
          pattern: ParchMint-*
          merge-multiple: true
          path: release
      - name: Verify package checksums
        working-directory: release
        run: sha256sum --check *.sha256
      - name: Publish packages and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing_release="$RUNNER_TEMP/existing-release.json"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets,tagName,targetCommitish > "$existing_release" 2>/dev/null; then
            python packaging/verify_release.py \
              --tag "$RELEASE_TAG" \
              --commit "$GITHUB_SHA" \
              < "$existing_release"
            echo "::notice title=Release already verified::$RELEASE_TAG already contains every expected package and checksum."
            exit 0
          fi
          gh release create "$RELEASE_TAG" release/*.deb release/*.dmg release/*.msi release/*.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "ParchMint ${RELEASE_TAG#v}" \
            --generate-notes \
            --notes "Download the installer for your operating system below. See the [installation guide](https://github.com/$GITHUB_REPOSITORY/blob/$RELEASE_TAG/docs/install.md)."
