name: CI

on:
  pull_request:
    paths:
      - ".github/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "rust-toolchain.toml"
      - "tests/**"
      - "third_party/**"
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "rust-toolchain.toml"
      - "tests/**"
      - "third_party/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.97.1"

jobs:
  workspace:
    name: ${{ matrix.os }} / workspace
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install "$RUST_TOOLCHAIN"
          --profile minimal
          --component clippy
          --component rustfmt

      - name: Fetch locked dependencies
        run: cargo +$RUST_TOOLCHAIN fetch --locked

      - name: Verify workspace metadata
        run: cargo +$RUST_TOOLCHAIN metadata --locked --offline --no-deps --format-version 1

      - name: Verify formatting
        run: cargo +$RUST_TOOLCHAIN fmt --all --check

      - name: Check locked workspace
        run: cargo +$RUST_TOOLCHAIN check --workspace --all-targets --locked --offline

      - name: Lint locked workspace
        run: >-
          cargo +$RUST_TOOLCHAIN clippy
          --workspace
          --all-targets
          --locked
          --offline
          --
          -D warnings

      - name: Test locked workspace
        run: cargo +$RUST_TOOLCHAIN test --workspace --locked --offline
