schema_version: 2
handoff_version: "1.0.1"
source:
  manifest: delivery/design-handoff/1.0.1/design-manifest.yaml
  component_matrix: delivery/design-handoff/1.0.1/specs/component-matrix.csv
  screen_inventory: delivery/design-handoff/1.0.1/specs/screen-inventory.csv
  interaction_spec: delivery/design-handoff/1.0.1/specs/interaction-spec.md
themes:
  light_token_set: "PM/Semantic/Light (dc55a0ad-9907-801d-8008-6a1fb40bcf7a)"
  dark_token_set: "PM/Semantic/Dark (469ffc7d-964a-806d-8008-6c323f6d3396)"
  system_resolution_adapter: "AppearancePreferenceAdapter resolves System from the platform appearance service; it selects Light or Dark and is not a third token set."
  generated_css_target: packages/design-system/src/generated/penpot-tokens.css
  generated_typescript_target: packages/design-system/src/generated/penpot-tokens.ts
  import_contract:
    source: delivery/design-handoff/1.0.1/tokens/tokens.json
    command: "scripts/design/import-penpot-tokens --handoff 1.0.1"
    rules:
      - Resolve DTCG aliases set-local then PM/Core; reject unresolved references and duplicate normalized names.
      - Emit source version and SHA-256 headers; sort normalized names; preserve descriptions and token type.
      - Normalize the legacy sourcesanspro identifier to Source Sans 3 only in generated UI-token metadata.
      - Emit complete semantic Light and Dark roles plus common/layout/motion metadata; reject role-parity or dark-canvas failures.
      - Generated outputs are committed, never edited manually; CI reruns the command and fails on a dirty diff.
components:
  - family: primitives-and-feedback
    penpot_components: [PM/Button, PM/Checkbox, PM/ContextMenu, PM/ContextMenuDivider, PM/ContextMenuItem, PM/ContextMenuSurface, PM/FocusVisible, PM/LoadingState, PM/MultilineField, PM/ProgressState, PM/Select, PM/TextField, PM/Toast, PM/Tooltip]
    code_target: packages/design-system/src/components/{Button,Checkbox,Menu,FocusRing,Fields,Feedback}.tsx
    state_owner: React view state only; commands remain application-owned.
  - family: workspace-shell
    penpot_components: [PM/WorkspaceTopBar/Export, PM/Sidebar, PM/Splitter, PM/StatusBar, PM/Inspector, PM/InspectorSection, PM/AppearanceChoice]
    code_target: apps/desktop-ui/src/features/workspace/{WorkspaceShell,Sidebar,Inspector,StatusBar,AppearanceChoice}.tsx
    state_owner: Workspace state is rebuildable; appearance is ApplicationPreferenceStore-owned.
  - family: hierarchy-and-cards
    penpot_components: [PM/Tree, PM/TreeRow/Root, PM/TreeRow/Group, PM/TreeRow/ActiveDocument, PM/Tree/MultiSelection, PM/Tree/CutState, PM/InlineRename, PM/Disclosure, PM/Card/Document, PM/Card/MetadataValue, PM/Card/InsertionMarker]
    code_target: apps/desktop-ui/src/features/hierarchy/{Tree,Cards,Selection,DragDrop}.tsx
    state_owner: ProjectCommandDispatcher owns mutations; UI owns ephemeral selection, hover, and drag preview.
  - family: editor
    penpot_components: [PM/EditorPane, PM/EditorPaneHeader, PM/EditorCanvas, PM/Tab, PM/FormattingToolbar, PM/StyleSelect, PM/LocalFindBar, PM/SearchMatch, PM/EditorContextMenu, PM/AtomicBreak/Scene, PM/AtomicBreak/Page]
    code_target: apps/desktop-ui/src/editor/{EditorPane,TabStrip,FormattingToolbar,LocalFind,EditorMenus}.tsx
    state_owner: ParchMint editor contract owns document edits; each view owns focus, selection, scroll, composition, and local find state.
  - family: comments-and-inspector-fields
    penpot_components: [PM/SynopsisEditor, PM/MetadataField, PM/CommentAnchorState, PM/CommentThread, PM/CommentMessage, PM/CommentRepliesToggle, PM/CommentReplyComposer, PM/OrphanedComment]
    code_target: apps/desktop-ui/src/features/{inspector,comments}/{Synopsis,Metadata,CommentThread}.tsx
    state_owner: ProjectCommandDispatcher owns Synopsis, metadata, and comment mutations; anchors come through the editor contract.
  - family: search-and-replace
    penpot_components: [PM/GlobalSearchPanel, PM/SearchResultGroup, PM/SearchResult, PM/ReplacePreview, PM/ReplacePreviewRow, PM/ReplacementSelectionControl]
    code_target: apps/desktop-ui/src/features/search/{GlobalSearch,ReplacePreview}.tsx
    state_owner: SearchIndex is queried only through its port; query/results/preview selection are disposable workspace state.
  - family: history-and-deletion
    penpot_components: [PM/HistoryTimeline, PM/HistoryEntry, PM/HistoryPreview, PM/HistoryCompare, PM/NamedSnapshot, PM/RestoreDialog, PM/RecentlyDeletedList, PM/DeletedItem, PM/DeletedItemPreview]
    code_target: apps/desktop-ui/src/features/{history,recently-deleted}/{History,RecentlyDeleted}.tsx
    state_owner: HistoryStore owns checkpoints/restoration; tombstones are project data.
  - family: settings-spellcheck-and-styles
    penpot_components: [PM/SettingsNav, PM/StyleEditor, PM/StyleActionDialog, PM/MetadataDefinitionEditor, PM/DictionarySettings, PM/SpellcheckUnderline, PM/SpellingContextMenu]
    code_target: apps/desktop-ui/src/features/settings/{Settings,Styles,Metadata,Dictionaries}.tsx
    state_owner: ProjectCommandDispatcher owns project settings; SpellcheckService owns decorations/suggestions.
  - family: launcher-export-and-recovery
    penpot_components: [PM/LauncherProjectCard, PM/NewProjectDialog, PM/ExportDialog, PM/ErrorBanner, PM/EmptyState, PM/RecoveryDialog]
    code_target: apps/desktop-ui/src/features/{launcher,export,recovery}/{Launcher,Export,Recovery}.tsx
    state_owner: Platform service owns native dialogs; save/recovery services own durable state and errors.
