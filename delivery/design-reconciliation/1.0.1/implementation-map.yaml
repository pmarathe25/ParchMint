interactions:
  - id: companion-focus
    interpretation: Toolbar and Inspector target only the focused view; shared content/history is distinct from each view's independent selection, scroll, focus, composition, and local-search state.
  - id: global-search-replace
    interpretation: Search replaces Explorer and targets the entire project; replace preview occupies the middle workspace rather than a modal.
  - id: appearance-cycle
    interpretation: System follows the OS; explicit choices override it; every open window updates without authored-state mutation, undo, save, or history.
  - id: history-restore
    interpretation: Only complete-project checkpoint restore is valid in v1; see ISSUE-003 for contradictory component variants.
  - id: export-entire-manuscript
    interpretation: One self-contained HTML export covers the entire Manuscript; native destination selection is a platform adapter concern.
accessibility:
  - Global F6 order is mode switch, toolbar, Explorer, active tab, focused editor, Inspector, status bar; retain the documented per-surface tab order and restoration.
  - Use semantic buttons, menus, dialogs, tabs, tree levels, radios, disclosure state, live regions, names, and pressed/expanded/selected state; icon-only controls require names and tooltips.
  - Focus/selection/disabled/error/search/comment/save states need non-color cues and tokenized focus rings in both themes; focused editor-pane indication is tab-strip/accessibility state, not an outline.
  - Native screen-reader, file-picker, menu, IME, and spellcheck behavior remains a Windows/macOS/Linux native validation obligation, not proven by screenshots.
platform_variants:
  - Windows/macOS/Linux share screens and canonical content; platform adapters own native menus/accelerators, file dialogs, title-bar/chrome, additive modifier, system appearance, and native spelling surfaces.
  - Enforce the 1280x720 logical-pixel minimum without a reduced/mobile layout; validate 1440x900, 1920x1080, and 2560x1440 layout references later.
assets:
  source: delivery/design-handoff/1.0.1/assets/icons/icon-index.json
  generated_target: packages/design-system/src/generated/penpot-icons/
  import_contract:
    - Verify each icon-index SHA-256 and SVG viewBox before copying; reject unindexed, missing, or checksum-mismatched assets.
    - Preserve source SVG and accessibility intent; do not rasterize or optimize destructively during import.
    - Resolve token-colored fill at render time; no theme-specific icon swap is approved.
    - Emit a sorted manifest with source checksum/version and make CI regenerate/copy then fail on a dirty diff.
