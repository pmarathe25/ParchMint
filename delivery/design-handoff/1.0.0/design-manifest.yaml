    severity: informational
  - id: DEV-004
    title: "Prototype flows are page-local documentation, not a cross-page launcher"
    spec: "specs/known-deviations.md"
    owner_action: "validate interactions from interaction-spec.md and board metadata"
    severity: informational
  - id: DEV-005
    title: "System appearance resolves at runtime; no System reference image"
    spec: "specs/known-deviations.md"
    owner_action: "matches APPR-001/002; no System screenshot"
    severity: informational
