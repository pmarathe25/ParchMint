  - do not modify governing documents, approved handoff, pipeline state, templates, or S00 evidence
  - do not silently resolve product/design conflicts; record them in open-issues.yaml
  - commit only owned paths on this branch; do not switch branches, merge, rebase, reset, push, fetch, or manage worktrees
