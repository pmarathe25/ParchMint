  - conflicts, ambiguities, known deviations, and no-silent-resolution review
  - bounded S50 and later-slice work breakdown with non-overlapping ownership
  - G10 approval file left pending and stage result needs_approval
resource_constraints:
  - no Tauri/application bootstrap or production UI/code
