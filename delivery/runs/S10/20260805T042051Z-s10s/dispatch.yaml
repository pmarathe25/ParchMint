required_evidence:
  - minimal active-file identity/revision/theme probe and zero-error validation before mutation
  - page-local visibility audit of every production screen with an expanded Explorer, including editor-dual-two-manuscript, editor-same-document-two-views, and both Manuscript/Research focus boards
  - proof that every expanded Explorer always renders both Manuscript and Research section roots regardless of which documents are open; an empty Research hierarchy still renders its root
  - restoration of the Research section root on every affected rendered board and of Research document rows only where the screen fixture actually contains those documents
  - proof Harbor Notes pane tabs remain hidden on editor-dual-two-manuscript while Chapter One and Chapter Two remain its pane documents
  - exact shape IDs and before/after hidden state for every mutation
  - proof no unrelated board, component, token, page, name, or content mutation occurred
  - zero-error validation after mutation and final live revision
  - stabilized Light and Dark exports of editor-dual-two-manuscript at 1440x900
  - direct visual inspection proving both Explorer roots, Chapter One/Two panes, readable prose, and fully dark Dark surfaces
  - authoritative native Penpot source export after the live mutation, or an explicit external-input blocker if native export remains unavailable
  - SHA-256, PNG dimensions, active-theme restoration, and exact evidence limits
resource_constraints:
  - all Penpot calls stay inside this patch worker to isolate high-volume output
  - begin with a minimal active-file probe and bounded board-local audits
  - mutate only hidden visibility state necessary to restore mandatory TREE-001 Explorer content
  - treat Global Search-replaces-Explorer screens and deliberately collapsed/hidden Explorer states as the only visibility-audit exceptions
  - on editor-dual-two-manuscript, unhide only PM / Sidebar / Section / Research (039701d9-7e2b-8031-8008-67b6372f8819) and PM / Sidebar / Row / Harbor Notes (039701d9-7e2b-8031-8008-67b6372f445b); keep both Harbor Notes pane-tab shapes hidden
  - inspect all other production boards with an expanded Explorer and mutate only if their Manuscript or Research section root is actually hidden
  - preserve distinct two-document versus same-document semantics, stable board IDs/names, PM component reuse, layout, content, focus, and semantic tokens
  - after theme switching, wait for repeated semantic color probes to stabilize before export
  - do not fabricate, image-generate, post-process, relabel, delete, or replace either board
  - if any Penpot call stalls, verify partial state before retrying
  - do not edit the draft handoff, reconciliation, traceability, prior validation evidence, state, proposals, docs, or production paths
  - do not run Git write operations; Orchestrator owns commits and publishing
  - leave candidate_commit/output_commit blank for Orchestrator finalization
