required_evidence:
  - immutable approved handoff 1.0.0 remains byte-identical to baseline
  - refreshed native Penpot source matches file ID 2be68822-842f-8175-8008-65eef13b0227 and contains the live Explorer visibility repair
  - repaired Light and Dark editor-dual-two-manuscript 1440x900 references visibly render both Manuscript and Research roots while retaining Chapter One and Chapter Two in separate panes
  - stable mapping for the distinct two-document and same-document-two-views boards; neither board is deleted or substituted
  - TREE-001 is recorded as an always-visible Manuscript/Research root invariant whenever Explorer is shown, with only Global Search-replaces-Explorer and collapsed/hidden Explorer exceptions
  - component and screen inventories carry requirement annotations before derived traceability is regenerated
  - PRJ-010 is mapped to launcher board e96ec683-a782-802c-8008-65f767f20cfd and PM/LauncherProjectCard e96ec683-a782-802c-8008-65f701e0505c
  - FMT-019, META-011, CARD-010, WORD-002, SPELL-004, SPELL-005, and A11Y-007 receive verified direct mappings or explicit evidence-backed dispositions
  - PLAT-001, PLAT-002, WS-011, APPR-006, A11Y-005, and A11Y-009 receive explicit verified mappings, token/contrast contracts, native-only dispositions, or blocking entries without inventing visual proof
  - the prior failed validation remains immutable; new adjudication evidence records that SAVE-014 and EXP-009 were already mapped while WS-011 was genuinely blank
  - all other requirements lacking Penpot mappings are explicitly classified as deferred, nonvisual/state/behavioral, native/performance/accessibility-only, security, or a true open issue
  - design manifest, asset inventory, source/reference provenance, checksums, open issues, implementation map, work breakdown, and visual-regression plan agree
  - the candidate remains draft and G10 pending until a fresh independent Terra validation passes and exact-candidate product-owner approval is recorded
resource_constraints:
  - treat the product specification as canonical over handoff components
  - edit the draft 1.0.1 package in place; never modify approved 1.0.0 or rewrite prior failed-validation evidence
  - do not add unsupported Search scope controls, partial Export scope, partial History restore, per-document spellcheck language, a ribbon Search destination, a floating comment control, or a toolbar appearance toggle
  - preserve exact stable PM names and Penpot IDs; leave nonvisual/native evidence limits explicit
  - no direct Penpot calls are authorized in this integration run; use committed repair evidence and externally supplied exports
  - the Orchestrator exclusively owns the evidence/source drop path and all Git writes, commits, pushes, PR updates, merges, and worktrees
  - perform non-source work first; if the refreshed source or either repaired PNG is absent, stop finalization with a precise external-input blocker rather than copying stale evidence or fabricating an artifact
  - do not broaden product, architecture, accessibility, performance, or platform claims beyond the available evidence
  - leave candidate_commit and output_commit blank for Orchestrator finalization
