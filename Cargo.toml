[workspace]
resolver = "3"
members = ["crates/*", "tests/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "GPL-3.0-or-later"
repository = "https://github.com/pmarathe25/ParchMint"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
toml = "=1.1.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[patch.crates-io]
iced_tiny_skia = { path = "third_party/iced_tiny_skia-0.14.0" }
